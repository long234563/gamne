      - name: Convert HTML to Android Project
        shell: bash
        run: |
          echo "Danh sach file trong repo:"
          ls -la

          HTML_FILE=$(find . -maxdepth 1 -type f -iname "*.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: Khong tim thay file HTML!"
            exit 1
          fi

          echo "Tim thay game: $HTML_FILE"

          mkdir -p "$RUNNER_TEMP/hac-anh-build/www"

          cp "$HTML_FILE" "$RUNNER_TEMP/hac-anh-build/www/index.html"

          cd "$RUNNER_TEMP/hac-anh-build"

          npm init -y

          npm install --save-exact @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

          npx cap init "Game Cua Long" "com.long.gamecualong" --web-dir www

          npx cap add android

          npx cap sync android
